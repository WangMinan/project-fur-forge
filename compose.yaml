name: project-fur-forge

x-app: &app
  image: ${FUR_FORGE_IMAGE:-project-fur-forge:phase-c1}
  env_file:
    - ${FUR_FORGE_ENV_FILE:-.env.production}
  environment:
    DATABASE_FILE: /app/data/studio.db
    TRUST_PROXY: "true"
  volumes:
    - studio-data:/app/data
    - studio-backups:/app/backups
  restart: "no"

services:
  migrate:
    <<: *app
    command: ["migrate"]

  app:
    <<: *app
    command: ["serve"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready',{headers:{host:new URL(process.env.PUBLIC_BASE_URL).host}}).then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    env_file:
      - ${FUR_FORGE_ENV_FILE:-.env.production}
    ports:
      - "${FUR_FORGE_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/templates/http.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  studio-data:
  studio-backups:
