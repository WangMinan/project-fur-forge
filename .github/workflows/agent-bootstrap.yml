name: Agent source bootstrap

on:
  push:
    branches:
      - fix/phase-c1-t34-f
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pack source
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.nuxt \
            --exclude=.output \
            --exclude=test-results \
            --exclude=playwright-report \
            --exclude=project-fur-forge-source.tgz \
            -czf project-fur-forge-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: project-fur-forge-source
          path: project-fur-forge-source.tgz
          if-no-files-found: error
          retention-days: 1
