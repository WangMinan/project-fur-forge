name: project-fur-forge

# T34-F6 · 生产编排模板。
#
# - 只引用 GitHub Actions 已发布的应用镜像，不在服务器端 build；
# - app 不发布宿主机端口，只由 nginx 通过 backend 网络访问；
# - backend 为内部网络；egress 单独用于 app 访问阿里云 OSS；
# - 正式域名、证书和线上演练在部署阶段补齐。

x-app-env: &app-env
  NODE_ENV: production
  APP_ENV: production
  HOST: 0.0.0.0
  PORT: "3000"
  DATABASE_FILE: /app/data/studio.db
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
  ADMIN_BASE_URL: ${ADMIN_BASE_URL:?set ADMIN_BASE_URL in .env}
  MEDIA_BASE_URL: ${MEDIA_BASE_URL:?set MEDIA_BASE_URL in .env}
  OSS_UPLOAD_BASE_URL: ${OSS_UPLOAD_BASE_URL:?set OSS_UPLOAD_BASE_URL in .env}
  OSS_REGION: ${OSS_REGION:?set OSS_REGION in .env}
  OSS_ENDPOINT: ${OSS_ENDPOINT:?set OSS_ENDPOINT in .env}
  OSS_PRIVATE_BUCKET: ${OSS_PRIVATE_BUCKET:?set OSS_PRIVATE_BUCKET in .env}
  OSS_PUBLIC_BUCKET: ${OSS_PUBLIC_BUCKET:?set OSS_PUBLIC_BUCKET in .env}
  OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?set OSS_ACCESS_KEY_ID in .env}
  OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?set OSS_ACCESS_KEY_SECRET in .env}
  ESA_SITE_ID: ${ESA_SITE_ID:?set ESA_SITE_ID in .env}
  ESA_ACCESS_KEY_ID: ${ESA_ACCESS_KEY_ID:?set ESA_ACCESS_KEY_ID in .env}
  ESA_ACCESS_KEY_SECRET: ${ESA_ACCESS_KEY_SECRET:?set ESA_ACCESS_KEY_SECRET in .env}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
  ICP_FILING_NUMBER: ${ICP_FILING_NUMBER:-}
  ICP_FILING_URL: ${ICP_FILING_URL:-}
  POLICE_FILING_STATUS: ${POLICE_FILING_STATUS:?set POLICE_FILING_STATUS in .env}
  POLICE_FILING_NUMBER: ${POLICE_FILING_NUMBER:-}
  POLICE_FILING_URL: ${POLICE_FILING_URL:-}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.250.0/24}

x-app-security: &app-security
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  migrate:
    image: ${APP_IMAGE:?set APP_IMAGE in .env}:${APP_IMAGE_TAG:-latest}
    command: ["node", "ops/ops.mjs", "migrate"]
    environment: *app-env
    volumes:
      - app-data:/app/data
    networks:
      - backend
    restart: "no"
    <<: *app-security

  app:
    image: ${APP_IMAGE:?set APP_IMAGE in .env}:${APP_IMAGE_TAG:-latest}
    environment: *app-env
    volumes:
      - app-data:/app/data
      - app-backups:/app/backups
    expose:
      - "3000"
    networks:
      - backend
      # backend 使用 internal:true，不能访问外部网络；单独加入 egress 才能访问 OSS。
      - egress
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    <<: *app-security

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      ADMIN_HOST: ${ADMIN_HOST:?set ADMIN_HOST in .env}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/etc/nginx/tls/fullchain.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/etc/nginx/tls/privkey.pem}
    volumes:
      - ./deploy/nginx/app.conf.template:/etc/nginx/templates/app.conf.template:ro
      - ./deploy/nginx/upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
      - ${TLS_CERT_DIR:-./deploy/nginx/tls}:/etc/nginx/tls:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - backend
      - edge
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true

volumes:
  app-data:
  app-backups:

networks:
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.30.250.0/24}
  egress:
    driver: bridge
  edge:
    driver: bridge
