name: quality

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'agent_docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'agent_docs/**'
  workflow_dispatch:
    inputs:
      release:
        description: Run explicit release/build/deployment verification
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release:
        required: false
        default: false
        type: boolean

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

env:
  APP_ENV: test
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.18.0
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2.0.2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Fast checks
        run: pnpm check:fast

      - name: Install Chromium
        if: ${{ inputs.release == true }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run release verification
        if: ${{ inputs.release == true }}
        run: pnpm test:release

      - name: Upload failed release-test artifacts
        if: ${{ inputs.release == true && failure() && !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-test-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  image-build:
    name: image-build
    if: ${{ inputs.release == true }}
    needs:
      - checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build application image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: project-fur-forge:quality
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image

      - name: Exercise app-only Compose and one-shot operations
        env:
          APP_IMAGE_REF: project-fur-forge:quality
          DATABASE_FILE: /app/data/studio.db
          PUBLIC_BASE_URL: https://public.test.invalid
          ADMIN_BASE_URL: https://admin.test.invalid
          MEDIA_BASE_URL: https://public-media.ditedog.com
          OSS_UPLOAD_BASE_URL: https://project-furry-forge-private.oss-cn-hangzhou.aliyuncs.com
          OSS_REGION: oss-cn-hangzhou
          OSS_ENDPOINT: https://oss-cn-hangzhou-internal.aliyuncs.com
          OSS_PRIVATE_BUCKET: project-furry-forge-private
          OSS_PUBLIC_BUCKET: project-furry-forge-public
          OSS_ACCESS_KEY_ID: ci-oss-access-key-id
          OSS_ACCESS_KEY_SECRET: ci-oss-access-key-secret
          ESA_SITE_ID: "1234567890"
          ESA_API_ENDPOINT: https://esa.cn-hangzhou.aliyuncs.com
          SESSION_SECRET: ci-placeholder-session-secret-at-least-32-chars
          POLICE_FILING_STATUS: unconfigured
          TRUSTED_PROXY_CIDRS: 172.30.250.1/32,192.0.2.0/24
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps app node ops/ops.mjs migrate
          docker compose run --rm --no-deps \
            -e ADMIN_USERNAME=ci-admin \
            -e ADMIN_PASSWORD=ci-init@password-2026 \
            app node ops/ops.mjs init-admin
          docker compose run --rm --no-deps \
            -e ADMIN_USERNAME=ci-admin \
            -e ADMIN_PASSWORD=ci-reset@password-2026 \
            app node ops/ops.mjs reset-admin-password \
            --confirm RESET_SINGLE_ADMIN_PASSWORD
          docker compose run --rm --no-deps app node ops/ops.mjs preflight

          if cleanup_usage="$(docker compose run --rm --no-deps app \
            node ops/ops.mjs r3-stage-a-cleanup 2>&1)"; then
            echo 'R3-A cleanup unexpectedly accepted a missing scope.' >&2
            exit 1
          fi
          grep -Fq 'Pass --environment-prefix with the exact confirmed object scope.' \
            <<<"${cleanup_usage}"
          ! grep -Fq 'Unexpected argument' <<<"${cleanup_usage}"

          if prune_usage="$(docker compose run --rm --no-deps app \
            node ops/ops.mjs r3-stage-a-prune-backups 2>&1)"; then
            echo 'R3-A backup pruning unexpectedly accepted missing paths.' >&2
            exit 1
          fi
          grep -Fq 'Usage: r3-stage-a-prune-backups' <<<"${prune_usage}"
          ! grep -Fq 'Unexpected argument' <<<"${prune_usage}"

          docker compose up --detach --no-build --no-deps app

          app_id="$(docker compose ps -q app)"
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${app_id}")"
            [[ "${status}" == "healthy" ]] && break
            [[ "${status}" == "unhealthy" ]] && exit 1
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "${app_id}")" = "healthy"
          curl --fail --silent --show-error --header 'Host: public.test.invalid' \
            http://127.0.0.1:3000/api/health/ready >/dev/null
          ss -lnt | grep -Eq '127\.0\.0\.1:3000[[:space:]]'
          ! ss -lnt | grep -Eq '(0\.0\.0\.0|\[::\]):3000[[:space:]]'

          docker compose run --rm --no-deps app node ops/ops.mjs backup \
            --output /app/backups/ci-before-restore.db
          docker compose run --rm --no-deps app node ops/ops.mjs restore-verify \
            --backup /app/backups/ci-before-restore.db --output /tmp/verify.db
          docker compose run --rm --no-deps app node ops/ops.mjs recover-operations
          docker compose restart app
          restarted_id="$(docker compose ps -q app)"
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${restarted_id}")"
            [[ "${status}" == "healthy" ]] && break
            [[ "${status}" == "unhealthy" ]] && exit 1
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "${restarted_id}")" = "healthy"

          docker compose stop app
          docker compose run --rm --no-deps app node ops/ops.mjs restore \
            --backup /app/backups/ci-before-restore.db --output /app/data/ci-restored.db
          DATABASE_FILE=/app/data/ci-restored.db docker compose up \
            --detach --no-build --no-deps --force-recreate app
          restored_id="$(DATABASE_FILE=/app/data/ci-restored.db docker compose ps -q app)"
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${restored_id}")"
            [[ "${status}" == "healthy" ]] && break
            [[ "${status}" == "unhealthy" ]] && exit 1
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "${restored_id}")" = "healthy"

          DATABASE_FILE=/app/data/studio.db docker compose up \
            --detach --no-build --no-deps --force-recreate app
          rollback_id="$(DATABASE_FILE=/app/data/studio.db docker compose ps -q app)"
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${rollback_id}")"
            [[ "${status}" == "healthy" ]] && break
            [[ "${status}" == "unhealthy" ]] && exit 1
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "${rollback_id}")" = "healthy"

          docker tag project-fur-forge:quality project-fur-forge:rollback-baseline
          rollback_fixture="${RUNNER_TEMP}/fur-forge-image-rollback"
          mkdir -p "${rollback_fixture}"
          cat >"${rollback_fixture}/Dockerfile" <<'EOF'
          FROM project-fur-forge:rollback-baseline
          LABEL org.opencontainers.image.description="controlled rollback candidate"
          EOF
          docker build --tag project-fur-forge:rollback-candidate "${rollback_fixture}"

          APP_IMAGE_REF=project-fur-forge:rollback-candidate docker compose up \
            --detach --no-build --no-deps --force-recreate app
          candidate_id="$(APP_IMAGE_REF=project-fur-forge:rollback-candidate \
            docker compose ps -q app)"
          candidate_image="$(docker inspect --format '{{.Image}}' "${candidate_id}")"
          test "${candidate_image}" = \
            "$(docker image inspect --format '{{.Id}}' project-fur-forge:rollback-candidate)"

          APP_IMAGE_REF=project-fur-forge:rollback-baseline docker compose up \
            --detach --no-build --no-deps --force-recreate app
          old_image_id="$(APP_IMAGE_REF=project-fur-forge:rollback-baseline \
            docker compose ps -q app)"
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${old_image_id}")"
            [[ "${status}" == "healthy" ]] && break
            [[ "${status}" == "unhealthy" ]] && exit 1
            sleep 2
          done
          old_image="$(docker inspect --format '{{.Image}}' "${old_image_id}")"
          test "${old_image}" = \
            "$(docker image inspect --format '{{.Id}}' project-fur-forge:rollback-baseline)"
          test "${old_image}" != "${candidate_image}"

      - name: Validate Nginx 1.30.4 HTTP-only config and reload
        run: |
          set -euo pipefail
          nginx_test="${RUNNER_TEMP}/fur-forge-nginx"
          mkdir -p "${nginx_test}/conf.d"
          sed \
            -e 's/@@PUBLIC_HOST@@/public.test.invalid/g' \
            -e 's/@@ADMIN_HOST@@/admin.test.invalid/g' \
            -e 's/@@MEDIA_HOST@@/media.test.invalid/g' \
            deploy/nginx/app.conf.template >"${nginx_test}/conf.d/ditedog.conf"
          cp deploy/nginx/00-connection-map.conf \
            "${nginx_test}/conf.d/00-connection-map.conf"
          cat >"${nginx_test}/nginx.conf" <<'EOF'
          events {}
          http {
              include /etc/nginx/mime.types;
              include /etc/nginx/conf.d/*.conf;
          }
          EOF
          docker run --detach --rm --name fur-forge-nginx-test \
            --network host \
            --volume "${nginx_test}/nginx.conf:/etc/nginx/nginx.conf:ro" \
            --volume "${nginx_test}/conf.d:/etc/nginx/conf.d:ro" \
            nginx:1.30.4
          docker exec fur-forge-nginx-test nginx -t
          docker exec fur-forge-nginx-test nginx -s reload
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Host: unknown.test.invalid' http://127.0.0.1/)" = "421"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Host: media.test.invalid' http://127.0.0.1/)" = "421"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Host: public.test.invalid' http://127.0.0.1/)" = "200"

          auth_headers="${nginx_test}/auth-headers.txt"
          auth_body="${nginx_test}/auth-body.json"
          test "$(curl --silent --show-error --output "${auth_body}" \
            --dump-header "${auth_headers}" --write-out '%{http_code}' \
            --header 'Host: admin.test.invalid' \
            --header 'Origin: https://admin.test.invalid' \
            --header 'Content-Type: application/json' \
            --data '{"username":"ci-admin","password":"ci-reset@password-2026"}' \
            http://127.0.0.1/api/auth/login)" = "200"
          grep -Eiq '^set-cookie: __Host-fur-forge-session=.*;.*Secure' "${auth_headers}"
          session_cookie="$(sed -nE \
            's/^set-cookie: ([^;]+).*/\1/ip' "${auth_headers}" | tr -d '\r')"
          csrf_token="$(jq -er '.data.csrfToken' "${auth_body}")"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Host: admin.test.invalid' \
            --header "Cookie: ${session_cookie}" \
            http://127.0.0.1/api/auth/session)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Host: admin.test.invalid' \
            --header 'Origin: https://admin.test.invalid' \
            --header "Cookie: ${session_cookie}" \
            http://127.0.0.1/api/auth/logout)" = "403"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Host: admin.test.invalid' \
            --header 'Origin: https://admin.test.invalid' \
            --header "Cookie: ${session_cookie}" \
            --header "x-csrf-token: ${csrf_token}" \
            http://127.0.0.1/api/auth/logout)" = "200"

      - name: Clean deployment smoke resources
        if: always()
        env:
          APP_IMAGE_REF: project-fur-forge:quality
          DATABASE_FILE: /app/data/studio.db
          PUBLIC_BASE_URL: https://public.test.invalid
          ADMIN_BASE_URL: https://admin.test.invalid
          MEDIA_BASE_URL: https://public-media.ditedog.com
          OSS_UPLOAD_BASE_URL: https://project-furry-forge-private.oss-cn-hangzhou.aliyuncs.com
          OSS_REGION: oss-cn-hangzhou
          OSS_ENDPOINT: https://oss-cn-hangzhou-internal.aliyuncs.com
          OSS_PRIVATE_BUCKET: project-furry-forge-private
          OSS_PUBLIC_BUCKET: project-furry-forge-public
          OSS_ACCESS_KEY_ID: ci-oss-access-key-id
          OSS_ACCESS_KEY_SECRET: ci-oss-access-key-secret
          ESA_SITE_ID: "1234567890"
          ESA_API_ENDPOINT: https://esa.cn-hangzhou.aliyuncs.com
          SESSION_SECRET: ci-placeholder-session-secret-at-least-32-chars
          POLICE_FILING_STATUS: unconfigured
          TRUSTED_PROXY_CIDRS: 172.30.250.1/32,192.0.2.0/24
        run: |
          docker rm --force fur-forge-nginx-test 2>/dev/null || true
          docker compose down --volumes --remove-orphans
