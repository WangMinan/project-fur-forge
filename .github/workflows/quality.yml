name: quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: test
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.18.0

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      # 生产产物必须在 APP_ENV=production 下构建：workflow 级的 APP_ENV=test 会让
      # nuxt.config.ts 把 tests/fixtures/runtime/* 编进 .output，随后 pnpm build
      # 内置的 guard-production-content 必然拒收夹具产物。lint/typecheck/test 仍
      # 需要 test 才能覆盖夹具，因此只在这一步覆盖。
      - name: Production build
        env:
          APP_ENV: production
        run: pnpm build

      # verify:production 自己会用 APP_ENV=test 起服务（scripts/verify-production.mjs），
      # 校验的是上一步已经构建好的 .output，不重新构建。
      - name: Verify production output
        run: pnpm verify:production

      - name: Secret and content scan
        run: node scripts/ci-secret-scan.mjs

      - name: Compose static config check
        env:
          APP_IMAGE: example/project-fur-forge
          APP_IMAGE_TAG: ci
          PUBLIC_HOST: public.example.test
          ADMIN_HOST: admin.example.test
          TLS_CERT_DIR: ./deploy/nginx/tls
          TLS_CERT_FILE: /etc/nginx/tls/fullchain.pem
          TLS_KEY_FILE: /etc/nginx/tls/privkey.pem
          PUBLIC_BASE_URL: https://public.example.test
          ADMIN_BASE_URL: https://admin.example.test
          MEDIA_BASE_URL: https://media.example.test
          OSS_UPLOAD_BASE_URL: https://private.example.test
          OSS_REGION: oss-cn-hangzhou
          OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
          OSS_PRIVATE_BUCKET: ci-private
          OSS_PUBLIC_BUCKET: ci-public
          OSS_ACCESS_KEY_ID: ci-placeholder
          OSS_ACCESS_KEY_SECRET: ci-placeholder
          SESSION_SECRET: ci-placeholder-session-secret-at-least-32-chars
          BACKEND_SUBNET: 172.30.250.0/24
          TRUSTED_PROXY_CIDRS: 172.30.250.0/24
        run: docker compose -f docker-compose.yaml config --quiet

      - name: Upload check artifacts
        if: always() && !cancelled()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: check-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  image-build:
    name: image-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build application image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: false
          load: false
          cache-from: type=gha,scope=quality-image
          cache-to: type=gha,mode=max,scope=quality-image

  e2e:
    name: e2e
    needs:
      - checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v2.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm test:e2e

      - name: Upload E2E artifacts
        if: always() && !cancelled()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
