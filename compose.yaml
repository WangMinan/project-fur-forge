# T34-F6 部署编排。
#
# 只引用已发布镜像，不使用本地 build：镜像由 GitHub Actions 构建推送。
# 本轮不在本地执行 `docker compose up`；这里只提供正确的编排文件。
#
# 用法见 docs/DEPLOYMENT.md。运行前复制 .env.compose.example 为 .env。

name: project-fur-forge

x-app-env: &app-env
  NODE_ENV: production
  APP_ENV: production
  HOST: 0.0.0.0
  PORT: "3000"
  DATABASE_FILE: /app/data/studio.db
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
  ADMIN_BASE_URL: ${ADMIN_BASE_URL:?set ADMIN_BASE_URL in .env}
  MEDIA_BASE_URL: ${MEDIA_BASE_URL:?set MEDIA_BASE_URL in .env}
  OSS_UPLOAD_BASE_URL: ${OSS_UPLOAD_BASE_URL:?set OSS_UPLOAD_BASE_URL in .env}
  OSS_REGION: ${OSS_REGION:?}
  OSS_ENDPOINT: ${OSS_ENDPOINT:?}
  OSS_PRIVATE_BUCKET: ${OSS_PRIVATE_BUCKET:?}
  OSS_PUBLIC_BUCKET: ${OSS_PUBLIC_BUCKET:?}
  OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?}
  OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?}
  SESSION_SECRET: ${SESSION_SECRET:?}
  # 仅在明确配置时才解析转发链，避免伪造 X-Forwarded-For。
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}

services:
  # 一次性迁移：app 启动前必须成功退出。
  migrate:
    image: ${APP_IMAGE:?set APP_IMAGE in .env}:${APP_IMAGE_TAG:-latest}
    command: ["node", "ops/ops.mjs", "migrate"]
    environment: *app-env
    volumes:
      - app-data:/app/data
    networks: [internal]
    restart: "no"

  app:
    image: ${APP_IMAGE:?set APP_IMAGE in .env}:${APP_IMAGE_TAG:-latest}
    environment: *app-env
    volumes:
      - app-data:/app/data
      - app-backups:/app/backups
    networks: [internal]
    # app 不直接暴露到公网：只有 nginx 发布 80/443。
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      ADMIN_HOST: ${ADMIN_HOST:?set ADMIN_HOST in .env}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/etc/nginx/tls/fullchain.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/etc/nginx/tls/privkey.pem}
    volumes:
      # Nginx 官方镜像会对 /etc/nginx/templates/*.template 做 envsubst。
      - ./deploy/nginx/app.conf.template:/etc/nginx/templates/app.conf.template:ro
      # WebSocket 升级映射必须在 http{} 层：放入 conf.d 由默认 include 加载。
      - ./deploy/nginx/upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
      # 正式证书由部署阶段挂载；本仓库不生成、不提交任何证书。
      - ${TLS_CERT_DIR:-./deploy/nginx/tls}:/etc/nginx/tls:ro
    ports:
      - "80:80"
      - "443:443"
    networks: [internal, edge]
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  app-data:
  app-backups:

networks:
  # app 与 migrate 只在内部网络，不可从外部直连。
  internal:
    internal: true
  edge:
