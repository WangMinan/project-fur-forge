name: release-image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Explicit immutable release label, for example gate-e-20260810
        required: true
        type: string
      confirmation:
        description: Type PUBLISH_GATE_E_IMAGE to authorize external publication
        required: true
        type: string

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      release: true

  publish:
    name: publish
    needs:
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate publish inputs
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "The frozen image can only be published from main." >&2
            exit 1
          fi
          if [[ "${CONFIRMATION}" != "PUBLISH_GATE_E_IMAGE" ]]; then
            echo "Explicit GATE-E image publication confirmation is missing." >&2
            exit 1
          fi
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "Docker Hub repository secrets are not configured." >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "The requested image tag is invalid." >&2
            exit 1
          fi
          if [[ "${REQUESTED_TAG}" == "latest" ]]; then
            echo "The mutable latest tag is forbidden for the frozen image." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/project-fur-forge
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
          provenance: mode=max
          sbom: true

      - name: Report image digest
        env:
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/project-fur-forge
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          jq -n \
            --arg commit "${GITHUB_SHA}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg repository "${IMAGE_REPOSITORY}" \
            --arg tag "${IMAGE_TAG}" \
            --arg image_ref "${image_ref}" \
            '{schemaVersion: 2, commit: $commit, repository: $repository, tag: $tag, digest: $digest, imageRef: $image_ref}' \
            > image-release-evidence.json
          {
            echo '### Frozen image'
            echo
            echo '```env'
            echo "FROZEN_SHA=${GITHUB_SHA}"
            echo "APP_IMAGE_REF=${image_ref}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: image-release-evidence-${{ github.sha }}
          path: image-release-evidence.json
          if-no-files-found: error
          retention-days: 30
